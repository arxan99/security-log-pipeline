name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Demo run on sample logs
        run: |
          python samples/generate.py samples
          for f in samples/auth.log samples/access.log samples/proxy.jsonl; do slp --db demo.db ingest --year 2026 "$f"; done
          slp --db demo.db detect
          slp --db demo.db report -o report.html
      - uses: actions/upload-artifact@v4
        with:
          name: alert-report-py${{ matrix.python }}
          path: report.html
